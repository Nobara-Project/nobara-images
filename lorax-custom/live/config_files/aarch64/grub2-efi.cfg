set default="1"

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

set timeout=60

# Lenovo ThinkPad T14s Gen 6 (Snapdragon X Elite): its kernel needs
# clk_ignore_unused pd_ignore_unused (https://fedoraproject.org/wiki/Thinkpad_t14s).
# Detected from SMBIOS (version or family "ThinkPad T14s Gen 6", machine type
# 21N1 or 21N2); smbios is built into Nobara's aarch64 GRUB, so this also works
# with Secure Boot on. The memory range the 64 GB model needs kept free
# (cutmem 0x8800000000 0x8fffffffff) is reserved by GRUB itself (grub2 2.12-67).
smbios --type 1 --get-string 0x05 --set nobara_product
smbios --type 1 --get-string 0x06 --set nobara_version
smbios --type 1 --get-string 0x1a --set nobara_family
if regexp "T14s Gen 6" "$nobara_version $nobara_family" || regexp "^21N[12]" "$nobara_product"; then
  set nobara_board_args="clk_ignore_unused pd_ignore_unused"
fi
### END /etc/grub.d/00_header ###

search --no-floppy --set=root -l '@ISOLABEL@'

### BEGIN /etc/grub.d/10_linux ###
menuentry 'Start @PRODUCT@ @VERSION@' --class red --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ @ROOT@ @EXTRA@ $nobara_board_args rd.live.image quiet rhgb
	initrd @INITRDPATH@
}
menuentry 'Test this media & start @PRODUCT@ @VERSION@' --class red --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ @ROOT@ @EXTRA@ $nobara_board_args rd.live.image rd.live.check quiet
	initrd @INITRDPATH@
}
# Snapdragon X laptops have no usable ACPI tables: Linux needs each model's
# device tree, which these entries load. GRUB refuses "devicetree" while
# Secure Boot is on, so they need it off in the firmware. Other UEFI aarch64
# systems (ACPI) use the entries above, Secure Boot on or off.
submenu 'Snapdragon X laptops (Secure Boot off) -->' {
	menuentry 'Lenovo ThinkPad T14s Gen 6 (LCD)' --class red --class gnu-linux --class gnu --class os {
		devicetree @DTBPATH@/qcom/x1e78100-lenovo-thinkpad-t14s.dtb
		linux @KERNELPATH@ @ROOT@ @EXTRA@ $nobara_board_args rd.live.image quiet rhgb
		initrd @INITRDPATH@
	}
